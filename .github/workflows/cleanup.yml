name: Cleanup Expired Demos
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove expired demos
        run: |
          python3 -c "
          import json, os, shutil
          from datetime import datetime
          manifest = json.load(open('manifest.json'))
          now = datetime.utcnow()
          kept = []
          removed = []
          for demo in manifest['demos']:
              expiry = datetime.fromisoformat(demo['expiry_date'])
              if expiry > now:
                  kept.append(demo)
              else:
                  path = demo.get('path', '')
                  if path and os.path.isdir(path):
                      shutil.rmtree(path)
                      removed.append(path)
          if removed:
              manifest['demos'] = kept
              json.dump(manifest, open('manifest.json', 'w'), indent=2)
              for p in removed:
                  print(f'Removed: {p}')
          else:
              print('No expired demos to remove')
          "
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Remove expired demos"
          git push
